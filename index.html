<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uang Mudah</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#eef4ff;
}

.header{
    background:#0B5ED7;
    color:white;
    padding:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container{
    padding:18px;
}

.card{
    background:white;
    border-radius:15px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#0B5ED7;
    color:white;
    font-size:16px;
    margin-top:10px;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="header" id="logo">💳 Uang Mudah</div>

<div class="container">

<div class="card" id="loginNasabah">

<h3>Login Nasabah</h3>

<input id="namaNasabah"
placeholder="Masukkan Nama Nasabah">

<button onclick="loginNasabah()">Masuk</button>

</div>

<div class="card hidden" id="loginAdmin">

<h3>Login Admin</h3>

<input type="password"
id="pinAdmin"
placeholder="Masukkan PIN">

<button onclick="loginAdmin()">Masuk Admin</button>

</div>

<div class="card hidden" id="dashboardAdmin">

<h3>Dashboard Admin</h3>

<input id="namaBaru"
placeholder="Nama Nasabah">

<input id="vaBaru"
placeholder="Nomor Virtual Account">

<input id="nominalBaru"
placeholder="Nominal Tagihan">

<input id="limitBaru"
placeholder="Limit Pinjaman">

<button>Simpan Nasabah</button>

</div>

<div class="card hidden" id="dashboardNasabah">

<h3 id="judulNama"></h3>

<p>Nomor VA</p>
<h2 id="vaNasabah"></h2>

<p>Nominal Tagihan</p>
<h2 id="nominalNasabah"></h2>

<p>Limit Pinjaman</p>
<h2 id="limitNasabah"></h2>

<p>Status Pembayaran</p>
<h3 id="statusNasabah"></h3>

<button>Sudah Melakukan Pembayaran</button>

</div>

</div>
